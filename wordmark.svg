<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" role="img" aria-label="Christian Macion">
  <style>
    .nm-plate { fill: #1f2328; }
    .nm-rule  { stroke: #b6b1a6; }
